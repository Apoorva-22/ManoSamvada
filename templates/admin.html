<!DOCTYPE html>
<html>
<head>
<title>Admin Login</title>

<style>
body{
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#121212;
    color:white;
}

.box{
    background:#1e1e1e;
    padding:30px;
    border-radius:12px;
    width:320px;
    text-align:center;
}

input{
    width:100%;
    padding:10px;
    border:none;
    border-radius:6px;
    outline:none;
    box-sizing:border-box;
}

/* password */
.password-wrap{
    width:100%;
    position:relative;
    margin-top:12px;
}

.password-wrap input{
    padding-right:55px;
}

.eye-btn{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    color:#444;
    font-size:13px;
    font-weight:600;
    user-select:none;
}

button{
    width:100%;
    margin-top:15px;
    padding:10px;
    background:#4CAF50;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="box">

    <h2>Admin Login</h2>

    <input
        type="text"
        id="username"
        placeholder="Username"
        onkeydown="handleKey(event)"
    >

    <div class="password-wrap">

        <input
            type="password"
            id="password"
            placeholder="Password"
            onkeydown="handleKey(event)"
        >

        <span
            class="eye-btn"
            id="togglePass"
            onclick="togglePassword()"
        >
            Show
        </span>

    </div>

    <button onclick="login()">
        Login
    </button>

</div>

<script>
function login(){

    fetch("/admin/login",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            username:
                document.getElementById("username").value,

            password:
                document.getElementById("password").value
        })
    })
    .then(r=>r.json())
    .then(data=>{

        if(data.success){
            window.location.href="/admin";
        }else{
            alert(data.message || "Invalid credentials");
        }
    });
}

function togglePassword(){

    const pass =
        document.getElementById("password");

    const btn =
        document.getElementById("togglePass");

    if(pass.type==="password"){

        pass.type="text";
        btn.innerText="Hide";

    }else{

        pass.type="password";
        btn.innerText="Show";
    }
}

function handleKey(e){

    if(e.key==="Enter"){
        e.preventDefault();
        login();
    }
}
</script>

</body>
</html>
