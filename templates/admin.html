<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>

    <style>
        body{
            font-family:Arial;
            background:#121212;
            color:white;
            padding:20px;
        }

        input{
            padding:8px;
            width:250px;
            margin-right:10px;
            border-radius:5px;
            border:none;
            outline:none;
        }

        button{
            padding:8px 12px;
            border:none;
            border-radius:5px;
            cursor:pointer;
            background:#2196F3;
            color:white;
        }

        .session{
            border:1px solid #333;
            margin-bottom:15px;
            border-radius:10px;
            overflow:hidden;
        }

        .session-header{
            background:#222;
            padding:10px;
            cursor:pointer;
            display:flex;
            justify-content:space-between;
        }

        .messages{
            display:none;
            padding:10px;
        }

        .message{
            margin:8px 0;
            padding:8px;
            border-radius:6px;
            background:#1e1e1e;
        }
    </style>
</head>

<body>

<h2>
    🧠 Admin Dashboard
    <span id="crisisCount" style="color:red;"></span>
</h2>

<input
    type="text"
    id="search"
    placeholder="Search user..."
>

<button onclick="toggleCrisis()" id="crisisBtn">
    Show Only Crisis
</button>

<button onclick="openExportDialog()">
    Export CSV
</button>

<div
    id="exportModal"
    style="
        display:none;
        position:fixed;
        inset:0;
        background:rgba(0,0,0,0.7);
        justify-content:center;
        align-items:center;
    "
>

    <div
        style="
            background:#1e1e1e;
            padding:20px;
            border-radius:10px;
            width:320px;
        "
    >

        <h3>Export CSV</h3>

        <input
            id="exportUser"
            placeholder="Username (optional)"
            style="width:100%;margin-bottom:10px;"
        >

        <label>
            <input
                type="checkbox"
                id="onlyCrisis"
            >
            Only Crisis
        </label>

        <br><br>

        <button onclick="downloadCSV()">
            Download
        </button>

        <button onclick="closeExportDialog()">
            Cancel
        </button>

    </div>
</div>
    
<button onclick="viewAnalyticsFromSearch()">
    View Analytics
</button>

<button onclick="logout()">
    Logout
</button>

<div id="container"></div>

<script>

let allData = [];
let showCrisisOnly = false;

// fetch data
fetch("/admin/data")
.then(res => res.json())
.then(data => {
    allData = data;
    render(data);
});

// crisis count
fetch("/admin/crisis-count")
.then(res => res.json())
.then(data => {
    document.getElementById("crisisCount").innerText =
        `🔴 ${data.count}`;
});

// render
function render(data){

    let container =
        document.getElementById("container");

    container.innerHTML = "";

    let grouped = {};

    data.forEach(row => {

        let searchText =
            document.getElementById("search")
            .value
            .toLowerCase();

        let username =
            (row.username || "Unknown User")
            .toLowerCase();

        if(
            searchText &&
            !username.includes(searchText)
        ) return;

        let key =
            username +
            "_session_" +
            row.session_id;

        if(!grouped[key]){
            grouped[key] = [];
        }

        grouped[key].push(row);
    });

    for(let key in grouped){

        let session = grouped[key];

        let hasCrisis =
            session.some(
                r => Number(r.is_crisis_flag) == 1
            );

        if(showCrisisOnly && !hasCrisis){
            continue;
        }

        let sessionDiv =
            document.createElement("div");

        sessionDiv.classList.add("session");

        let header =
            document.createElement("div");

        header.classList.add("session-header");

        let firstRow = session[0];

        header.innerHTML = `
            <span>
                ${firstRow.username || "Unknown User"} |
                Session ${firstRow.session_id}
            </span>
            <span>▼</span>
        `;

        if(hasCrisis){
            header.style.borderLeft =
                "5px solid red";
        }

        let messagesDiv =
            document.createElement("div");

        messagesDiv.classList.add("messages");

        header.onclick = () => {

            messagesDiv.style.display =
                messagesDiv.style.display === "none"
                ? "block"
                : "none";
        };

        let totalMessages =
            session.length;

        let crisisCount =
            session.filter(
                r =>
                    Number(
                        r.is_crisis_flag
                    ) == 1
            ).length;

        let emotionMap = {};

        session.forEach(r => {

            let e =
                r.emotion_label ||
                "neutral";

            emotionMap[e] =
                (emotionMap[e] || 0) + 1;
        });

        let dominantEmotion =
            Object.keys(emotionMap).length > 0
            ? Object.keys(emotionMap)
                .reduce((a,b)=>
                    emotionMap[a] >
                    emotionMap[b]
                    ? a
                    : b
                )
            : "neutral";

        let startTime =
            session[0].timestamp;

        let endTime =
            session[
                session.length - 1
            ].timestamp;

        messagesDiv.innerHTML = `
            <div class="message">

                🕒 Start: ${startTime}<br>

                🕒 End: ${endTime}<br><br>

                💬 Messages:
                ${totalMessages}<br>

                🔥 Emotion:
                ${dominantEmotion}<br>

                ${
                    crisisCount > 0
                    ? "🚨 Crisis Detected"
                    : "Safe"
                }

            </div>
        `;

        sessionDiv.appendChild(header);
        sessionDiv.appendChild(messagesDiv);

        container.appendChild(sessionDiv);
    }
}

// search
document
.getElementById("search")
.addEventListener("input", () => {

    render(allData);
});

// crisis toggle
function toggleCrisis(){

    showCrisisOnly =
        !showCrisisOnly;

    let btn =
        document.getElementById(
            "crisisBtn"
        );

    btn.innerText =
        showCrisisOnly
        ? "Show All Sessions"
        : "Show Only Crisis";

    render(allData);
}

// export
function openExportDialog(){

    document.getElementById(
        "exportModal"
    ).style.display = "flex";
}

function closeExportDialog(){

    document.getElementById(
        "exportModal"
    ).style.display = "none";
}

function downloadCSV(){

    let user =
        document.getElementById(
            "exportUser"
        ).value.trim();

    let crisis =
        document.getElementById(
            "onlyCrisis"
        ).checked;

    let url =
        `/admin/export?user=${encodeURIComponent(user)}&crisis=${crisis}`;

    window.location.href = url;

    closeExportDialog();
}

// analytics
function viewAnalyticsFromSearch(){

    let username =
        document
        .getElementById("search")
        .value
        .trim();

    if(!username){

        alert("Enter username first");
        return;
    }

    window.location.href =
        `/admin/analytics-page?user=${username}`;
}

// logout
function logout(){

    window.location.href =
        "/admin/logout";
}

history.pushState(
    null,
    null,
    location.href
);

window.onpopstate =
function () {

    window.location.href =
        "/admin/login";
};

</script>

</body>
</html>
