<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>

<style>
body{
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#121212;
    color:white;
}

.box{
    background:#1e1e1e;
    padding:30px;
    border-radius:12px;
    width:300px;
    text-align:center;
}

input{
    width:90%;
    padding:10px;
    margin:10px auto;
    border-radius:6px;
    border:none;
    outline:none;
    display:block;
    box-sizing:border-box;
}

/* password wrapper */
.password-wrap{
    width:90%;
    margin:10px auto;
    position:relative;
}

/* password field */
.password-wrap input{
    width:100%;
    margin:0;
    padding:10px 36px 10px 10px;
}

/* eye */
.eye-btn{
    position:absolute;
    right:10px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    font-size:14px;
    user-select:none;
    color:black;
}

button{
    width:90%;
    padding:10px;
    margin-top:10px;
    background:#4CAF50;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
}

button:hover{
    background:#45a049;
}
</style>
</head>

<body>

<div class="box">

    <h2>Admin Login</h2>

    <input
        type="text"
        id="username"
        placeholder="Username"
        onkeydown="handleKey(event)"
    >

    <div class="password-wrap">

        <input
            type="password"
            id="password"
            placeholder="Password"
            onkeydown="handleKey(event)"
        >

        <span
            class="eye-btn"
            onclick="togglePassword()"
        >👁</span>

    </div>

    <button onclick="login()">
        Login
    </button>

</div>

<script>
function login(){

    fetch("/admin/login",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            username:
                document.getElementById("username").value,

            password:
                document.getElementById("password").value
        })
    })
    .then(r=>r.json())
    .then(data=>{

        if(data.success){

            window.location.href="/admin";

        }else{

            alert(
                data.message ||
                "Invalid credentials"
            );
        }
    });
}

function togglePassword(){

    const pass =
        document.getElementById("password");

    if(pass.type==="password"){
        pass.type="text";
    }else{
        pass.type="password";
    }
}

function handleKey(e){

    if(e.key==="Enter"){

        e.preventDefault();
        login();
    }
}
</script>

</body>
</html>
