<!DOCTYPE html>
<html>
<head>
    <title>Your Emotion Analysis</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
    body {
        background: #121212;
        color: white;
        font-family: Arial;
        padding: 20px;
    }

    .card {
        background: #1e1e1e;
        padding: 20px;
        margin: 10px 0;
        border-radius: 12px;
        box-shadow: 0 0 10px rgba(0,0,0,0.4);
    }

    .charts {
        display: flex;
        gap: 20px;
    }

    canvas {
        max-width: 100%;
        height: 300px !important;
    }

    #dominant, #crisis {
        margin-top: 8px;
        font-weight: 500;
    }
</style>

</head>

<body>

<h2>🧠 Your Emotional Analysis</h2>

<div class="card">
    <p id="sessions"></p>
    <p id="messages"></p>
    <p id="dominant"></p>
    <p id="crisis"></p>
</div>

<div class="charts">

    <div class="card">
        <h3>Emotion Distribution</h3>
        <canvas id="pieChart"></canvas>
    </div>

    <div class="card">
        <h3>Daily Activity</h3>
        <canvas id="lineChart"></canvas>
    </div>

</div>

<script>

fetch("/user/analytics-data")
.then(res => res.json())
.then(data => {

    if(!data || !data.emotions){
        console.log("No data");
        return;
    }

    // TEXT DATA
    document.getElementById("sessions").innerText =
        "Sessions: " + data.sessions;

    document.getElementById("messages").innerText =
        "Total Messages: " + data.chats;

    let crisisEl = document.getElementById("crisis");
    let dominantEl = document.getElementById("dominant");

    // 🔥 REMOVE CRISIS FROM EMOTIONS
    let filtered = data.emotions.filter(e => e.emotion_label !== "crisis");

    // 🔥 DOMINANT EMOTION
    let dominant = filtered.length > 0
        ? [...filtered].sort((a,b)=>b.count-a.count)[0].emotion_label
        : "None";

    dominantEl.innerText = "🔥 Dominant Emotion: " + dominant;

    // 🎨 COLOR
    if(dominant === "angry"){
        dominantEl.style.color = "#ff4d4d";
    } 
    else if(dominant === "happy"){
        dominantEl.style.color = "#ffa500";
    } 
    else {
        dominantEl.style.color = "#4db8ff";
    }

    // 🚨 CRISIS
    if(data.crisis > 0){
        crisisEl.innerHTML = "🚨 <span style='color:#ff4d4d'>Crisis Detected</span>";
    } else {
        crisisEl.innerText = "No Crisis";
    }

    // 🥧 PIE CHART
    new Chart(document.getElementById("pieChart"), {
        type: "pie",
        data: {
            labels: filtered.map(e => e.emotion_label),
            datasets: [{
                data: filtered.map(e => e.count)
            }]
        },
        options: {
            plugins: {
                legend: {
                    position: "bottom",
                    labels: { color: "white" }
                }
            }
        }
    });

    // 📈 LINE CHART
    let lineLabels = data.daily.map(d =>
        new Date(d.date).toLocaleDateString("en-IN", {
            day: "numeric",
            month: "short"
        })
    );

    let lineValues = data.daily.map(d => d.count);

    new Chart(document.getElementById("lineChart"), {
        type: "line",
        data: {
            labels: lineLabels,
            datasets: [{
                label: "Chats per day",
                data: lineValues,
                tension: 0.4,
                fill: true
            }]
        },
        options: {
            plugins: {
                legend: {
                    labels: { color: "white" }
                }
            },
            scales: {
                x: { ticks: { color: "white" } },
                y: { ticks: { color: "white" } }
            }
        }
    });

})
.catch(err => console.error("ERROR:", err));

</script>

</body>
</html>
