<!DOCTYPE html>
<html>
<head>
    <title>Your Emotion Analysis</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
    body {
        background: #121212;
        color: white;
        font-family: Arial;
        padding: 20px;
    }

    .card {
        background: #1e1e1e;
        padding: 20px;
        margin: 10px 0;
        border-radius: 12px;
        box-shadow: 0 0 10px rgba(0,0,0,0.4);
    }

    .charts {
        display: flex;
        gap: 20px;
    }

    canvas {
        max-width: 100%;
        height: 300px !important;
    }

    #dominant, #crisis {
        margin-top: 8px;
        font-weight: 500;
    }

    #supportCard{
        margin-top:15px;
        line-height:1.6;
    }
    
    #supportCard h3{
        margin-bottom:10px;
    }
    
    .support-good{
        border-left:4px solid #4CAF50;
    }
    
    .support-help{
        border-left:4px solid #4db8ff;
    }
    
    .support-alert{
        border-left:4px solid #ff4d4d;
    }
    
</style>

</head>

<body>

<h2>🧠 Your Emotional Analysis</h2>

<div class="card">
    <p id="sessions"></p>
    <p id="messages"></p>
    <p id="dominant"></p>
    <p id="crisis"></p>
</div>

<div class="card" id="supportCard"></div>
<div class="charts">

    <div class="card">
        <h3>Emotion Distribution</h3>
        <canvas id="pieChart"></canvas>
    </div>

    <div class="card">
        <h3>Daily Activity</h3>
        <canvas id="lineChart"></canvas>
    </div>

</div>

<script>

fetch("/user/analytics-data")
.then(res => res.json())
.then(data => {

    if(!data || !data.emotions){
        console.log("No data");
        return;
    }

    // TEXT DATA
    document.getElementById("sessions").innerText =
        "Sessions: " + data.sessions;

    document.getElementById("messages").innerText =
        "Total Messages: " + data.chats;

    let crisisEl = document.getElementById("crisis");
    let dominantEl = document.getElementById("dominant");

    // 🔥 REMOVE CRISIS FROM EMOTIONS
    let filtered = data.emotions.filter(e => e.emotion_label !== "crisis");

    // 🔥 DOMINANT EMOTION
    let dominant = filtered.length > 0
        ? [...filtered].sort((a,b)=>b.count-a.count)[0].emotion_label
        : "None";

    dominantEl.innerText = "🔥 Dominant Emotion: " + dominant;

    let supportCard = document.getElementById("supportCard");

    if(dominant === "happy"){
    
        supportCard.className = "card support-good";
    
        supportCard.innerHTML = `
            <h3>💙 You're doing really well</h3>
    
            <p>
                We’re proud of the emotional progress you’ve made.
                Keep checking in with yourself and take care.
            </p>
        `;
    }
    
    else if(dominant === "sad" || dominant === "neutral"){
    
        supportCard.className = "card support-help";
    
        supportCard.innerHTML = `
            <h3>🤝 Need someone to talk to?</h3>
    
            <p>
                Tele-MANAS: 14416
                <br>
                AASRA: +91 22 2754 6669
            </p>
    
            <p>
                Talking to a therapist can help when things feel heavy.
            </p>
        `;
    }
    
    else if(dominant === "angry"){
    
        supportCard.className = "card support-help";
    
        supportCard.innerHTML = `
            <h3>🌿 Support is available</h3>
    
            <p>
                Tele-MANAS: 14416
                <br>
                AASRA: +91 22 2754 6669
            </p>
    
            <p>
                It may help to talk through intense emotions with a professional.
            </p>
        `;
    }
    
    if(data.crisis > 0){
    
        supportCard.className = "card support-alert";
    
        supportCard.innerHTML = `
            <h3>🚨 Please reach out now</h3>
    
            <p>
                Tele-MANAS: 14416
                <br>
                AASRA: +91 22 2754 6669
            </p>
    
            <p>
                If someone you trust is available,
                please contact them right now.
            </p>
        `;
    }
    
    // 🎨 COLOR
    if(dominant === "angry"){
        dominantEl.style.color = "#ff4d4d";
    } 
    else if(dominant === "happy"){
        dominantEl.style.color = "#ffa500";
    } 
    else {
        dominantEl.style.color = "#4db8ff";
    }

    // 🚨 CRISIS
    if(data.crisis > 0){
        crisisEl.innerHTML = "🚨 <span style='color:#ff4d4d'>Crisis Detected</span>";
    } else {
        crisisEl.innerText = "No Crisis";
    }

    // 🥧 PIE CHART
    new Chart(document.getElementById("pieChart"), {
        type: "pie",
        data: {
            labels: filtered.map(e => e.emotion_label),
            datasets: [{
                data: filtered.map(e => e.count)
            }]
        },
        options: {
            plugins: {
                legend: {
                    position: "bottom",
                    labels: { color: "white" }
                }
            }
        }
    });

    // 📈 LINE CHART
    let lineLabels = data.daily.map(d =>
        new Date(d.date).toLocaleDateString("en-IN", {
            day: "numeric",
            month: "short"
        })
    );

    let lineValues = data.daily.map(d => d.count);

    new Chart(document.getElementById("lineChart"), {
        type: "line",
        data: {
            labels: lineLabels,
            datasets: [{
                label: "Chats per day",
                data: lineValues,
                tension: 0.4,
                fill: true
            }]
        },
        options: {
            plugins: {
                legend: {
                    labels: { color: "white" }
                }
            },
            scales: {
                x: { ticks: { color: "white" } },
                y: { ticks: { color: "white" } }
            }
        }
    });

})
.catch(err => console.error("ERROR:", err));

</script>

</body>
</html>
