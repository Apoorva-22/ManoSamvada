<!DOCTYPE html>
<html>
<head>
<title>Login - Manosamvad</title>

<style>
body {
    font-family: Arial;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #121212;
    color: white;
}

.box {
    background: #1e1e1e;
    padding: 30px;
    border-radius: 12px;
    width: 300px;
    text-align: center;
}
input,
button,
.password-wrap{
    width:90%;
    margin:10px auto;
    display:block;
}

input{
    padding:10px;
    border-radius:6px;
    border:none;
    outline:none;

    box-sizing:border-box;
}

.password-wrap{
    position:relative;
}

.password-wrap input{
    width:100%;
    margin:0;

    padding:10px 38px 10px 10px;

    border-radius:6px;
    border:none;
    outline:none;

    box-sizing:border-box;
}

.eye-btn{
    position:absolute;

    right:12px;
    top:50%;

    transform:translateY(-50%);

    cursor:pointer;

    font-size:15px;
    color:black;
}

button{
    padding:10px;

    background:#4CAF50;
    color:white;

    border:none;
    border-radius:6px;

    cursor:pointer;
}

button:hover {
    background: #45a049;
}
</style>
</head>

<body>

<div class="box">
    <h2>Login</h2>

    <input
        type="text"
        id="username"
        placeholder="Username"
        onkeydown="handleLoginKey(event)"
    >
    <div class="password-wrap">
        <input
            type="password"
            id="password"
            placeholder="Password"
            onkeydown="handleLoginKey(event)"
        >
    
        <span class="eye-btn" onclick="togglePassword()">👁</span>
    </div>

    <button onclick="login()">Login</button>
</div>

<script>
function login(){
    let username = document.getElementById("username").value;
    let password = document.getElementById("password").value;

    fetch("/login", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            username: username,
            password: password
        })
    })
    .then(res => res.json())
    .then(data => {
        if(data.success){
            localStorage.setItem("currentUser", JSON.stringify(data.user));
            window.location.href = "/chat-page";
        } else {
            alert("Invalid credentials");
        }
    });
}
</script>
<script>
history.pushState(null, null, location.href);
window.onpopstate = function () {
    window.location.href = "/";
};

function togglePassword(){

    const pass = document.getElementById("password");

    if(pass.type === "password"){
        pass.type = "text";
    }else{
        pass.type = "password";
    }
}

function handleLoginKey(e){

    if(e.key === "Enter"){
        e.preventDefault();
        login();
    }
}
</script>
</body>
</html>
