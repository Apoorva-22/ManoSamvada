
<!DOCTYPE html>
<html>
<head>
<title>Welcome - Manosamvad</title>

<style>
body {
    margin: 0;
    height: 100vh;
    font-family: Arial;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    position: relative;
    overflow: hidden;
}

/* Background */
.bg {
    position: absolute;
    width: 100%;
    height: 100%;
    background: url("/static/img1.jpg") no-repeat center;
    background-size: cover;
    filter: contrast(1.1) brightness(1.05);
    z-index: -2;
}

/* Overlay */
.overlay {
    position: absolute;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.2);
    backdrop-filter: brightness(0.9);
    z-index: -1;
}

/* Content */
.container {
    text-align: center;
    animation: fadeIn 2s ease-in-out;
}

h5 {
    font-size: 80px;
    margin: 0;
    text-shadow: 2px 2px 10px rgba(0,0,0,0.7);
}

p {
    font-size: 28px;
    margin-top: 10px;
    font-style: italic;
    text-shadow: 1px 1px 8px rgba(0,0,0,0.7);
}

/* Buttons */
.buttons {
    margin-top: 30px;
}

button {
    padding: 12px 25px;
    margin: 10px;
    font-size: 16px;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    transition: 0.3s;
}

/* Login */
.login-btn {
    background-color: #4CAF50;
    color: white;
}
.login-btn:hover {
    background-color: #45a049;
}

/* Signup */
.signup-btn {
    background-color: #2196F3;
    color: white;
}
.signup-btn:hover {
    background-color: #1976D2;
}

/* Guest */
.guest-btn {
    background-color: #FF9800;
    color: white;
}
.guest-btn:hover {
    background-color: #FB8C00;
}

/* Footer */
.footer {
    position: absolute;
    bottom: 15px;
    font-size: 14px;
    opacity: 0.8;
    color: black; 
}

/* Animation */
@keyframes fadeIn {
    from {opacity: 0; transform: translateY(20px);}
    to {opacity: 1; transform: translateY(0);}
}
</style>

</head>

<body>

<div class="bg"></div>
<div class="overlay"></div>

<div class="container">
    <h5>मनोसंवाद</h5>
    <p>"Because every thought deserves to be heard"</p>

    <div class="buttons">
        <button class="login-btn" onclick="goLogin()">Login</button>
        <button class="signup-btn" onclick="goSignup()">Sign Up</button>
        <button class="guest-btn" onclick="goGuest()">Continue as Guest</button>
    </div>
</div>

<div class="footer">
    @ Manosamvad does not hinder medical diagnosis, it only complements traditional mental health care. 💙
</div>

<script>
function goLogin() {
    window.location.href = "/login";
}

function goSignup() {
    window.location.href = "/signup";
}

function goGuest() {
    window.location.href = "/guest";
}
</script>

</body>
</html>
